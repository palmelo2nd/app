<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>reading</title>
<!-- ?v=Nはキャッシュバスティング用。変更時はcss・js/app.js・js/modes・js/modulesのimportも含めて全箇所を同じ新しい値にする -->
<link rel="stylesheet" href="css/style.css?v=1">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
</head>
<body>
<div class="app-shell">

  <!-- 機能の切り替え（表紙・book・dream・rules・log） -->
  <nav class="mode-nav" id="mode-nav"></nav>

  <!-- 常時表示バー：brainの常時表示バーと同一スタイル・文言 -->
  <div class="top-bar">
    <div class="top-bar-group">
        <button id="load-btn-top" class="js-load-btn">読込</button>
        <button id="save-btn-top" class="js-save-btn">保存</button>
    </div>

    <div class="top-bar-group">
        <input type="password" id="token-input-top" class="js-token-input" placeholder="GitHub Personal Access Token">
        <input type="password" id="passphrase-input-top" class="js-passphrase-input" placeholder="本のパスフレーズ（初回のみ）" autocomplete="off" hidden>
    </div>

    <span id="network-status-top" class="js-network-status"></span>

    <div class="top-bar-group">
        <button id="cache-reset-btn" class="js-cache-reset-btn" title="デバイス等で更新が反映されない場合に押してください">キャッシュ更新</button>
        <span id="app-version-badge" class="app-version-badge"></span>
    </div>
  </div>

  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <p class="loading">「読込」を押してください。</p>
    </nav>

    <main class="content" id="content">
      <p class="placeholder">読み込み中...</p>
    </main>
  </div>

</div>

<script type="module" src="js/app.js?v=1"></script>
</body>
</html>
