<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日記</title>
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<div class="app-shell">

  <!-- 常時表示バー：brain・bookと同一スタイル・文言 -->
  <div class="top-bar">
    <div class="top-bar-group">
        <button id="load-btn-top" class="js-load-btn">読込</button>
        <button id="save-btn-top" class="js-save-btn">保存</button>
    </div>

    <div class="top-bar-group">
        <input type="password" id="token-input-top" class="js-token-input" placeholder="GitHub Personal Access Token">
    </div>

    <span id="network-status-top" class="js-network-status"></span>

    <div class="top-bar-group">
        <button id="cache-reset-btn" class="js-cache-reset-btn" title="デバイス等で更新が反映されない場合に押してください">キャッシュ更新</button>
        <span id="app-version-badge" class="app-version-badge"></span>
    </div>
  </div>

  <!-- メニュー：日記／設定 -->
  <div class="view-tabs">
    <button type="button" class="view-tab-btn active" data-view="diary">日記</button>
    <button type="button" class="view-tab-btn" data-view="settings">設定</button>
  </div>

  <main class="diary-view" id="diary-view"></main>

  <main class="settings-view" id="settings-view" hidden></main>

  <div class="toast" id="toast" hidden></div>

</div>

<script type="module" src="js/app.js?v=2"></script>
</body>
</html>
