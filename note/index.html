<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ナレッジ</title>
<!-- css/style.css・js/app.jsの「?v=N」はキャッシュバスティング用。JS/CSSを変えたら、ここと全import文の値を同じだけ上げる -->
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<div class="app-shell">

  <!-- 常時表示バー：diary・bookと同じスタイル・文言 -->
  <div class="top-bar">
    <div class="top-bar-group">
        <button id="load-btn-top" class="js-load-btn">読込</button>
        <button id="save-btn-top" class="js-save-btn">保存</button>
    </div>

    <div class="top-bar-group">
        <input type="password" id="token-input-top" class="js-token-input" placeholder="GitHub Personal Access Token">
    </div>

    <span id="network-status-top" class="js-network-status"></span>

    <div class="top-bar-group">
        <button id="cache-reset-btn" class="js-cache-reset-btn" title="デバイス等で更新が反映されない場合に押してください">キャッシュ更新</button>
        <span id="app-version-badge" class="app-version-badge"></span>
    </div>
  </div>

  <div class="layout" id="layout">
    <!-- 左（スマホでは一覧画面）：検索・分類・新規・一覧 -->
    <section class="list-pane" id="list-pane">
      <div class="panel list-panel">
        <input type="search" id="search-input" class="form-input search-input" placeholder="検索（題名・タグ・本文）" autocomplete="off">
        <div class="list-tools">
          <div class="chips" id="category-chips"></div>
          <button type="button" id="new-btn" class="btn btn-primary btn-small">新規</button>
        </div>
        <div class="list-count" id="list-count"></div>
        <div class="note-list" id="note-list"></div>
      </div>
    </section>

    <!-- 右（スマホではノート画面）：表示／編集 -->
    <section class="note-pane" id="note-pane"></section>
  </div>

  <div class="toast" id="toast" hidden></div>

</div>

<script type="module" src="js/app.js?v=2"></script>
</body>
</html>
