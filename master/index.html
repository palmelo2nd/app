<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Master</title>
    <!-- 管理者（my）用の入口ページ。3つの用途別INDEXへのリンクと、用途ごとのトークン保存を1か所にまとめる（2026-11-02）。
         どのメニューからもリンクしない。css・jsの「?v=N」はキャッシュバスティング用で、index.html・js/app.jsのimport文も含め同じ値に揃える。 -->
    <link rel="stylesheet" href="../index_common/css/style.css?v=9">
    <link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>
<div class="app-shell">
    <h2>Master</h2>

    <div class="top-bar">
        <span id="network-status-top" class="js-network-status"></span>
        <div class="top-bar-group">
            <button id="cache-reset-btn" class="js-cache-reset-btn" title="デバイス等で更新が反映されない場合に押してください">キャッシュ更新</button>
            <span id="app-version-badge" class="app-version-badge"></span>
        </div>
    </div>

    <p id="gate-message" class="app-links-message"></p>
    <div id="space-list" class="space-list"></div>
</div>
<script type="module" src="js/app.js?v=3"></script>
</body>
</html>
